[project]
name = "veo3-kien99-v1-clean"
version = "1.0.0"
description = "Minimal Google Flow UI runner through a real Edge CDP session"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "playwright==1.54.0",
  "pydantic==2.11.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
